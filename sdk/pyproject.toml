[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auroraos-sdk"
version = "0.1.0"
description = "Build Python applications for AuroraOS consoles"
requires-python = ">=3.8"

[project.scripts]
aurora-python = "aurora_sdk.cli:main"

[tool.setuptools]
py-modules = ["aurcc"]

[tool.setuptools.packages.find]
where = ["."]
