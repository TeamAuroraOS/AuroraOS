name: C SDK

on:
  push:
    paths:
      - "sdk/**"
      - "include/**"
      - "src/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "include/**"
      - "src/**"
      - ".github/workflows/sdk.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi
      - name: Run SDK tests
        run: python sdk/tests/run_tests.py --cross-build
      - name: Check Python SDK package
        run: python -m pip install ./sdk
      - name: Check Python SDK host tools
        run: aurora-python doctor
      - name: Check SDK prerequisites
        run: python sdk/aurcc.py doctor
      - name: Build SDK examples
        run: |
          for app in hello demo bricks net; do
            python sdk/aurcc.py build "sdk/examples/$app" \
              -o "/tmp/aurora-$app.bin" \
              --build-dir "/tmp/aurora-sdk-build-$app"
          done
